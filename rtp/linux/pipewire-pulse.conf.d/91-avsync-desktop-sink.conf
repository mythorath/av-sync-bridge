# Stable capture point for the RTP desktop audio. The receiver plays into this
# null sink and OBS records it, so receiver restarts never remove OBS's source.
# If you already have a pulse.cmd array in another pipewire-pulse.conf.d file,
# add this line to that array instead (PipeWire 1.0 does not merge the arrays).
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=avsync_desktop format=float32le rate=48000 channels=2 channel_map=front-left,front-right sink_properties=device.description=AVSync_Windows_Desktop" flags = [ ] }
]
