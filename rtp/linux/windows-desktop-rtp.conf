# Windows desktop audio over a direct point-to-point link (sender -> this machine, UDP 46000).
# Standard PipeWire RTP receiver: drift is corrected continuously by PipeWire's
# rate-matching DLL, which holds the jitter buffer at sess.latency.msec.
# Sender restarts, silence and packet gaps resync in place; nothing here exits on them.
context.properties = {
    log.level = 3   # 3 logs every resync; 2 for warnings only
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 rt.prio = 88 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-rtp-source
        args = {
            local.ifname = eth1           # your point-to-point NIC
            source.ip = 192.0.2.10          # this machine's address on that link
            source.port = 46000
            sess.latency.msec = 50
            sess.ignore-ssrc = true
            sess.media = "audio"
            audio.format = "S24BE"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            stream.props = {
                media.class = "Stream/Output/Audio"
                node.name = "windows_desktop_rtp"
                node.description = "Windows Desktop (RTP)"
                node.always-process = true
                target.object = "avsync_desktop"
                node.dont-fallback = true
            }
        }
    }
]
